<body style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">

        <option value="">-- Choose a role --</option>

  <button onclick="startAssessment()">Start Assessment</button>

      <!-- ✅ Logout button moved here -->
      <div style="margin-top: 20px;">
        <button onclick="logout()" class="btn-blue mt-4">Logout</button>
      </div>

    <div id="instructions"></div>

    <!-- 📋 Assessment Form (hidden until a role is selected) -->

      <h2>Assessment</h2>
      <form id="assessmentForm">
        <div id="questions" class="space-y-4"></div>
        <button type="submit">Submit Assessment</button>

  </div>

    <div class="centered mt-4">
  <a href="pricing.html" class="btn-blue">Pricing</a>
</div>
     <img id="logo" src="" alt="Logo" />

<script>

  let loadedQuestions = [];

const clientId = localStorage.getItem("clientId");

if (!clientId) {
  alert("Client configuration missing. Please log in again.");
  localStorage.clear();
  window.location.href = "login.html";
}
  
  document.addEventListener("DOMContentLoaded", () => {
    console.log("📦 DOM loaded");
    
  const storedUser = localStorage.getItem("currentUser");
    console.log("👤 currentUser:", storedUser);
  console.log("🏢 clientId:", clientId);
    // ✅ Fetch Client ID
fetch(`${API_BASE_URL}/api/client/${clientId}`)
  .then(res => res.json())
  .then(data => {
    console.log("🎨 Client branding:", data);
    document.body.style.backgroundColor = data.primaryColor;
    
    const logo = document.querySelector('#logo');
if (logo && data.logoUrl) {
  logo.src = data.logoUrl;
}

const instructions = document.querySelector('#instructions');
if (instructions && data.instructions) {
  instructions.textContent = data.instructions;
}

  })
    .catch(err => {
    console.error("❌ Branding fetch failed", err);
    });

  currentUser = JSON.parse(storedUser);
  document.getElementById("roleSelection").classList.remove("hidden");
});
  
  const questionBank = {

};

  function startAssessment() {
  const role = document.getElementById("roleDropdown").value;
  const error = document.getElementById("roleError");
  if (!role) {
    error.classList.remove("hidden");
    return;
  }
  error.classList.add("hidden");
  selectedRole = role;

  const clientId = localStorage.getItem("clientId");
  console.log("🔁 Fetching questions for:", selectedRole, "Client ID:", clientId);

  fetch(`${API_BASE_URL}/api/questions/${selectedRole}/${clientId}`)
    .then(res => res.json())
    .then(data => {
      loadQuestions(data);
      loadedQuestions = data;
      document.getElementById("roleSelection").classList.add("hidden");
      document.getElementById("assessmentSection").classList.remove("hidden");
    })
    .catch(err => {
      console.error("❌ Failed to load questions:", err);
    });
}

function loadQuestions(questions) {
  const container = document.getElementById("questions");
  container.innerHTML = '';

  questions.forEach((q, index) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'p-4 border rounded';

    const title = document.createElement('p');
    title.textContent = `${index + 1}. ${q.question}`;
    wrapper.appendChild(title);

    if (q.image) {
      const img = document.createElement('img');
      img.src = q.image;
      img.style.maxWidth = '100%';
      wrapper.appendChild(img);
    }

    if (q.type === "mcq") {
      q.options.forEach(opt => {
        const label = document.createElement('label');
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `q${index}`;
        radio.value = opt;

        label.appendChild(radio);
        label.append(opt);
        wrapper.appendChild(label);
      });
    } else {
      const textarea = document.createElement('textarea');
      textarea.name = `q${index}`;
      wrapper.appendChild(textarea);
    }

    container.appendChild(wrapper);
  });
}

// ✅ Properly placed outside loadQuestions()
document.getElementById("assessmentForm").addEventListener("submit", function (e) {
  e.preventDefault();

  if (!currentUser) {
    alert("Your session has expired. Please log in again.");
    window.location.href = "login.html";
    return;
  }

  const resultDiv = document.getElementById("result");
  const questions = loadedQuestions;

  let score = 0, total = 0;
  const responses = questions.map((q, index) => {
    const input = document.forms["assessmentForm"].elements[`q${index}`];
    
    let value = '';
    if (input) {
      if (input.value !== undefined) {
        value = input.value;
      } else {
        const textarea = input.querySelector('textarea');
        if (textarea) value = textarea.value;
      }
    }
    
    if (q.type === "mcq") {
      total++;
      if (value === q.answer) score++;
    }
    return { question: q.question, type: q.type, answer: value };
  });

  fetch(`${API_BASE_URL}/api/submit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: currentUser.name,
      email: currentUser.email,
      role: selectedRole,
      responses
    })
  })
  .then(res => res.json())
  .then(data => {
    resultDiv.innerHTML = `
      <div>
        You scored <strong>${score}</strong> out of <strong>${total}</strong> on the multiple-choice section.
      </div>
      <p>${data.message}</p>
    `;
  })
  .catch(() => {
    resultDiv.innerHTML = `<p>❌ There was an error submitting your assessment.</p>`;
  });
});

// ✅ Add this logout function
  function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
  }
    
</script>
</body>
</html>
