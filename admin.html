<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Submissions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-theme">
   <!-- Top Navigation Bar -->
  <header class="admin-topbar">
    <div class="admin-logo">
      <img src="AssessIQ_logoT.png" alt="AssessIQ Logo">
    </div>
    <div class="admin-top-actions">
      <span class="admin-user">Admin Panel</span>
      <button class="admin-logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="admin-hero">
    <h1>Assessment Dashboard</h1>
    <p>Manage candidate submissions with a premium, streamlined interface.</p>
  </section>

  <!-- Main Content Wrapper -->
  <div class="admin-wrapper">

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <nav>
        <a class="nav-item active">📄 Submissions</a>
        <a class="nav-item">👤 Candidates</a>
        <a class="nav-item">🏢 Clients</a>
        <a class="nav-item">⚙️ Settings</a>
      </nav>
    </aside>

    <!-- Main Panel -->
    <main class="admin-main">

      <!-- Login Panel -->
      <div id="login" class="admin-panel glass-panel">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Login</button>
        <p id="login-error" class="alert-error hidden">❌ Invalid credentials</p>
      </div>

      <!-- Submissions Panel -->
      <div id="submissions-container" class="admin-panel glass-panel hidden">
        <h2>Submitted Assessments</h2>
        <div id="submissions">Loading...</div>
      </div>
     <!-- 🔓 Logout Button -->
  <button onclick="logout()" style="margin-top: 20px;">Logout</button>
    </main>
  </div>

  <script>
    async function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('login-error');
      
      try {
        const res = await fetch(
          'https://candidateassessment.onrender.com/api/admin/login',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          }
        );

    if (!res.ok) throw new Error();

    const data = await res.json();
    localStorage.setItem('adminToken', data.token);

    document.getElementById('login').style.display = 'none';
    document.getElementById('submissions-container').classList.remove('hidden');
    loadSubmissions();
  } catch {
    error.classList.remove('hidden');
  }
}
    
    function loadSubmissions() {
  const token = localStorage.getItem("adminToken");

  fetch('https://candidateassessment.onrender.com/api/submissions', {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("Unauthorized or network error");
    return res.json();
  })
  .then(data => {
    const container = document.getElementById('submissions');
    container.innerHTML = '';

    if (data.length === 0) {
      container.textContent = 'No submissions found.';
      return;
    }

    // Sort submissions: newest first
    data.sort((a, b) => new Date(b.date) - new Date(a.date));

    data.forEach(entry => {
  const card = document.createElement('div');
  card.className = 'submission-card';

  const title = document.createElement('h3');
  title.textContent = entry.name;

  const meta = document.createElement('p');
  meta.className = 'submission-meta';
  meta.textContent = `${entry.role || 'Unknown role'} — ${new Date(entry.date).toLocaleString()}`;

  const viewLink = document.createElement('a');
  viewLink.href = `submission.html?id=${entry._id}`;
  viewLink.textContent = 'View Submission';
  viewLink.className = 'view-button';

  card.appendChild(title);
  card.appendChild(meta);
  card.appendChild(viewLink);

  container.appendChild(card);
});
  })
  .catch(err => {
    console.error(err);
    document.getElementById('submissions').textContent = '❌ Error loading data.';
  });
}

    if (!localStorage.getItem('adminToken')) {
  document.getElementById('login').style.display = 'block';
}
    function logout() {
  localStorage.removeItem("adminToken");
  localStorage.removeItem("isAdmin");
  location.reload(); // Refresh to show login screen again
}
  </script>
</body>
</html>
