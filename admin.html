<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Submissions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">
  <div class="card container">
  <h1 class="centered mb-4">Admin Panel</h1>
  <!-- 🔐 Login Form -->
  <div id="login">
    <h2>Login Required</h2>
    <input type="text" id="username" placeholder="Username"
           autocapitalize="off" autocomplete="off"/>
    <input type="password" id="password" placeholder="Password"
           autocapitalize="off" autocomplete="off"/>
    <button onclick="checkLogin()">Login</button>
    <p id="login-error" class="alert-error hidden">❌ Invalid credentials</p>
  </div>

  <!-- 📋 Submissions Display -->
  <div id="submissions-container" class="hidden">
    <h2>Submitted Assessments</h2>
    <div id="submissions">Loading...</div>
  </div>

  <script>
    async function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('login-error');
      
      try {
        const res = await fetch(
          'https://candidateassessment.onrender.com/api/admin/login',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          }
        );

    if (!res.ok) throw new Error();

    const data = await res.json();
    localStorage.setItem('adminToken', data.token);

    document.getElementById('login').style.display = 'none';
    document.getElementById('submissions-container').classList.remove('hidden');
    loadSubmissions();
  } catch {
    error.classList.remove('hidden');
  }
}
    
    function loadSubmissions() {
      const token = localStorage.getItem('adminToken');
      fetch('https://candidateassessment.onrender.com/api/submissions', {
        headers: {
          Authorization: `Bearer ${token}`
        }
      })
        .then(res => {
          if (!res.ok) throw new Error();
          return res.json();
        })
        .then(data => {
          const container = document.getElementById('submissions');
          container.innerHTML = '';
          
          data.forEach(entry => {
            const box = document.createElement('div');
            box.className = 'card mb-4';

      box.innerHTML = `
        <p><strong>Name:</strong> ${entry.name}</p>
        <p><strong>Email:</strong> ${entry.email}</p>
        <p><strong>Date:</strong> ${new Date(entry.date).toLocaleString()}</p>
        <hr>
        ${entry.responses.map(r => `
          <p><strong>Q:</strong> ${r.question}</p>
          <p><strong>A:</strong> ${r.answer || '—'}</p>
        `).join('')}
      `;
      container.appendChild(box);
    });
  })
  .catch(() => {
    document.getElementById('submissions').textContent =
      '❌ Unauthorized or expired session.';
  });
}

    if (!localStorage.getItem('adminToken')) {
  document.getElementById('login').style.display = 'block';
}
  </script>
</body>
</html>
