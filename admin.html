<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Submissions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">
  <div class="card container">
  <h1 class="centered mb-4">Admin Panel</h1>
  <!-- 🔐 Login Form -->
  <div id="login">
    <h2>Login Required</h2>
    <input type="text" id="username" placeholder="Username"
           autocapitalize="off" autocomplete="off"/>
    <input type="password" id="password" placeholder="Password"
           autocapitalize="off" autocomplete="off"/>
    <button onclick="checkLogin()">Login</button>
    <p id="login-error" class="alert-error hidden">❌ Invalid credentials</p>
  </div>

  <!-- 📋 Submissions Display -->
  <div id="submissions-container" class="hidden">
    <h2>Submitted Assessments</h2>
    <div id="submissions">Loading...</div>
  </div>
     <!-- 🔓 Logout Button -->
  <button onclick="logout()" style="margin-top: 20px;">Logout</button>
  </div>

  <script>
    async function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('login-error');
      
      try {
        const res = await fetch(
          'https://candidateassessment.onrender.com/api/admin/login',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          }
        );

    if (!res.ok) throw new Error();

    const data = await res.json();
    localStorage.setItem('adminToken', data.token);

    document.getElementById('login').style.display = 'none';
    document.getElementById('submissions-container').classList.remove('hidden');
    loadSubmissions();
  } catch {
    error.classList.remove('hidden');
  }
}
    
    function loadSubmissions() {
  const token = localStorage.getItem("adminToken");

  fetch('https://candidateassessment.onrender.com/api/submissions', {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("Unauthorized or network error");
    return res.json();
  })
  .then(data => {
    const container = document.getElementById('submissions');
    container.innerHTML = '';

    if (data.length === 0) {
      container.textContent = 'No submissions found.';
      return;
    }

    // Sort submissions: newest first
    data.sort((a, b) => new Date(b.date) - new Date(a.date));

    data.forEach(entry => {
      const link = document.createElement('a');
      link.href = `submission.html?id=${entry._id}`;
      link.textContent = `${entry.name} — ${new Date(entry.date).toLocaleString()}`;
      link.className = "block mb-3 text-blue-700 font-medium hover:underline";

      container.appendChild(link);
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById('submissions').textContent = '❌ Error loading data.';
  });
}

    if (!localStorage.getItem('adminToken')) {
  document.getElementById('login').style.display = 'block';
}
    function logout() {
  localStorage.removeItem("adminToken");
  localStorage.removeItem("isAdmin");
  location.reload(); // Refresh to show login screen again
}
  </script>
</body>
</html>
