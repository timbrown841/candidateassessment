<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Submissions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">

  <div class="card container">
  
<form id="resetForm">
  <input type="password" placeholder="New password" id="newPass" required>
  <button type="submit">Set New Password</button>
</form>
  </div>

<script>
  const token = new URLSearchParams(window.location.search).get("token");

if (!token) {
  document.getElementById("emailInfo").textContent = "❌ Invalid reset link.";
} else {
  fetch(`https://candidateassessment.onrender.com/api/validate-reset-token?token=${token}`)
    .then(res => res.json())
    .then(data => {
      if (data.email) {
        document.getElementById("emailInfo").textContent = `Resetting password for: ${data.email}`;
      } else {
        document.getElementById("emailInfo").textContent = "❌ Invalid or expired reset link.";
      }
    })
    .catch(() => {
      document.getElementById("emailInfo").textContent = "❌ Error validating token.";
    });
}
  
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPass').value;

  const res = await fetch('https://candidateassessment.onrender.com/api/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ token, newPassword })
  });

  const data = await res.json();
  alert(data.message || data.error);
});
</script>
</body>
</html>
