<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">

   <div class="logo-top-left">
      <a href="login.html">
  <img id="logo" src="AssessIQ_logoT.png" alt="AssessIQ Logo" style="max-width: 200px; cursor: pointer;" />
      </a>
</div>

  <div class="card container">
  

<form id="forgotForm">
  <input type="email" placeholder="Enter your email" id="forgotEmail" required>
  <button type="submit">Reset Password</button>
</form>
  </div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value;

  const res = await fetch('https://candidateassessment.onrender.com/api/request-password-reset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email })
  });

  const data = await res.json();
  alert(data.message || data.error);
});
</script>
</body>
</html>
