<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Candidate Assessment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-theme" 
      style="background: url('interview_bkgrd.jpg') no-repeat center center fixed; background-size: cover;">
  <div class="card container">

     <div class="logo-top-left">
      <a href="login.html">
  <img id="logo" src="AssessIQ_logoT.png" alt="AssessIQ Logo" style="max-width: 200px; cursor: pointer;" />
      </a>
</div>
    
    <h1 class="centered mb-4">Login to Continue</h1>

    <div id="loginForm">
      <h2>Login</h2>
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button onclick="handleLogin()">Login</button>
      <p>
        <a href="register.html">Don't have an account? Register</a>
      </p>
      <p>
        <a href="forgot-password.html">Forgot your password?</a>
      </p>
      <p id="loginError" class="alert-error hidden">❌ Invalid login credentials</p>
    </div>
  </div>

  <!-- 🔐 Admin Login Button -->
<div style="margin-top: 20px; text-align: center;">
  <a href="admin.html" class="btn-blue">Admin Login</a>
</div>

   <div class="centered mt-4">
  <a href="pricing.html" class="btn-blue">Pricing</a>
</div>

  <script>
    const existingUser = localStorage.getItem("currentUser");
  if (existingUser) {
    window.location.href = "assessment.html";
  }

  const API_BASE_URL = 'https://candidateassessment.onrender.com';

  function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value.trim();
    const error = document.getElementById("loginError");

    fetch(`${API_BASE_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        error.textContent = data.error;
        error.classList.remove("hidden");
      } else {
        // ✅ CORRECT STORAGE
        localStorage.setItem("currentUser", JSON.stringify(data.user));
        localStorage.setItem("clientId", data.user.clientId);
        window.location.href = "assessment.html";
      }
    })
    .catch(() => {
      error.textContent = "❌ Login failed. Please try again.";
      error.classList.remove("hidden");
    });
  }
  </script>
</body>
</html>
